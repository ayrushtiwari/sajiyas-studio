function login(m=''){root.innerHTML=`<div class="lg"><form class="box" onsubmit="return go(event)"><h1>Welcome back</h1><p class="sub" style="text-align:center">Sign in to manage Sajiya's Studio</p><label>Email</label><input id="e" type="email" placeholder="you@example.com" autocomplete="username" required><label>Password</label><input id="p" type="password" placeholder="Your password" autocomplete="current-password" required><p class="err" id="lm">${m}</p><button class="btn" style="width:100%;margin:8px 0 0;padding:13px">Sign in</button></form></div>`}
async function go(e){e.preventDefault();$('#lm').textContent='';const {error}=await sb.auth.signInWithPassword({email:$('#e').value,password:$('#p').value});if(error)return $('#lm').textContent='Wrong email or password.';start();return false}
function shell(){document.body.classList.remove('ed');const t=[['dash','Dashboard',`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>`],['cards','Cards',`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 9"/></svg>`],['rev','Reviews',`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>`],['set','Settings',`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>`]];
 root.innerHTML=`<header class="top"><div class="br"><b>Sajiya's Studio</b></div><button class="lo" onclick="openSite()" aria-label="Open website"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span>Website</span></button></header><div class="m" id="m"><div class="sk"></div></div><nav class="bn">${t.map(([k,l,i])=>`<a class="${k===tab?'on':''}" onclick="tab='${k}';cur=null;NF=[];shell()">${i}<span>${l}</span></a>`).join('')}</nav>`;V[tab]()}
const V={
async dash(){const [c,cr,br,k]=await Promise.all([sb.from('cards').select('id,category_id,images'),sb.from('card_reviews').select('status'),sb.from('brand_reviews').select('rating,status'),sb.from('categories').select('*').order('sort_order')]);
 const a=c.data||[],x=cr.data||[],y=br.data||[],ap=y.filter(r=>r.status==='approved');cats=k.data||[];window.CATS=cats;
 const i=[['Total cards',a.length],['Total reviews',x.length+y.length],['Brand rating',ap.length?(ap.reduce((s,r)=>s+r.rating,0)/ap.length).toFixed(1):'—'],['Pending reviews',[...x,...y].filter(r=>r.status==='pending').length]];
 const un=a.filter(d=>!d.category_id).length,T=(id,n,l)=>`<div class="ctile${l.length?'':' em'}" onclick="catView('${id}')"><b class="nm">${esc(n)}</b><div class="vw">${l.length?'View cards':'Add first card'} <span>→</span></div></div>`;
 $('#m').innerHTML=`<h2 class="ch">Categories</h2><p class="sub" style="margin:-6px 0 14px">Tap a category to see its cards</p><div class="cl">${cats.map(q=>T(q.id,q.name,a.filter(d=>d.category_id===q.id))).join('')}${un?T('none','Uncategorised',a.filter(d=>!d.category_id)):''}</div>${cats.length?'':'<p class="box" style="text-align:center;opacity:.6">No categories yet. Add them in Settings.</p>'}`},
async cards(){document.body.classList.toggle('ed',!!cur);if(cur)return form();
 const [c,k]=await Promise.all([sb.from('cards').select('*,categories(name)').order('created_at',{ascending:false}),sb.from('categories').select('*').order('sort_order')]);cats=k.data||[];window.CL=c.data||[];
 $('#m').innerHTML=`<div class="row"><div class="grow"><h1>Cards</h1><p class="sub">Manage your invitation designs</p></div><button class="btn" onclick="cur={title:'',description:'',customization:'',category_id:'',images:[],featured:false,published:true};files=[];NF=[];V.cards()">+ Add card</button></div>${CL.length?CL.map(d=>`<div class="box row crd">${d.images?.[0]?`<img src="${esc(d.images[0])}">`:'<div style="width:56px;height:70px;background:var(--b);border-radius:8px"></div>'}<div class="grow"><b>${esc(d.title)}</b><br><small style="opacity:.6">${esc(d.categories?.name||'No category')} · ${d.published?'Published':'Hidden'}${d.featured?' · ★ Featured':''}</small></div><div class="acts"><button class="btn ${d.featured?'':'l'}" onclick="tg('${d.id}','featured')">★ ${d.featured?'Featured':'Feature'}</button><button class="btn l" onclick="tg('${d.id}','published')">${d.published?'Hide':'Publish'}</button><button class="btn l" onclick="ed('${d.id}')">Edit</button><button class="btn r" onclick="dc('${d.id}')">Delete</button></div></div>`).join(''):'<p class="box" style="text-align:center;opacity:.6">No cards yet. Add your first design.</p>'}`},
async rev(){const t=window.rt||'card_reviews';const [a,b,r]=await Promise.all([sb.from('card_reviews').select('id',{count:'exact',head:true}),sb.from('brand_reviews').select('id',{count:'exact',head:true}),sb.from(t).select(t==='card_reviews'?'*,cards(title)':'*').order('created_at',{ascending:false})]);
 const l=r.data||[],ini=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(),dt=d=>new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}),lb={approved:'Visible',rejected:'Hidden',pending:'Pending'};
 $('#m').innerHTML=`<h1>Reviews</h1><p class="sub">Moderate what customers say</p><div class="seg"><button class="${t==='card_reviews'?'on':''}" onclick="rt='card_reviews';V.rev()">Card reviews<em>${a.count||0}</em></button><button class="${t==='brand_reviews'?'on':''}" onclick="rt='brand_reviews';V.rev()">Brand reviews<em>${b.count||0}</em></button></div>${l.length?l.map(x=>`<div class="rv"><div class="rh2"><div class="av">${esc(ini(x.reviewer_name))}</div><div class="grow"><b>${esc(x.reviewer_name)}</b><div class="stars">${'★'.repeat(x.rating)}${'☆'.repeat(5-x.rating)}</div></div><span class="tag ${x.status}">${lb[x.status]||x.status}</span></div>${x.cards?.title?`<div class="on2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 9"/></svg><span>Review for</span><b>${esc(x.cards.title)}</b></div>`:''}<p>${esc(x.comment)}</p><div class="ft"><small>${dt(x.created_at)}</small><div class="acts2"><button class="btn l" onclick="rs('${x.id}','${x.status==='approved'?'rejected':'approved'}')">${x.status==='approved'?'Hide':'Show'}</button><button class="btn r" onclick="rd('${x.id}')">Delete</button></div></div></div>`).join(''):'<p class="box" style="text-align:center;opacity:.6">No reviews yet.</p>'}`},
async set(){const [s,c]=await Promise.all([sb.from('settings').select('*').eq('id',1).single(),sb.from('categories').select('*').order('sort_order')]);const d=s.data||{};cats=c.data||[];
 const F=(k,l)=>`<label>${l}</label><input id="s_${k}" value="${esc(d[k]||'')}">`;
 $('#m').innerHTML=`<h1>Settings</h1><p class="sub">Brand details and categories</p><div class="box fm">${F('brand_name','Brand name')}${F('tagline','Tagline')}${F('website_url','Website link')}<label>WhatsApp number</label><input id="s_whatsapp_number" type="tel" inputmode="numeric" maxlength="10" placeholder="e.g. 9876543210" value="${esc(String(d.whatsapp_number||'').replace(/\D/g,'').replace(/^91(?=\d{10}$)/,''))}"><p id="sm" class="err"></p><button class="btn" onclick="ss()">Save settings</button></div><h2>Categories</h2>${cats.map(x=>`<div class="box row"><span class="grow">${esc(x.name)}</span><button class="btn r" onclick="dcat('${x.id}')">Delete</button></div>`).join('')}<div class="addc"><label>Add a new category</label><div class="ar"><input id="nc" placeholder="e.g. Baby Shower Invitations" maxlength="60" onkeydown="if(event.key==='Enter')ac()"><button class="btn" onclick="ac()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add</button></div></div><div class="acct"><p class="al">Account</p><button class="lgo" onclick="lg()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H5a2 2 0 00-2 2v12a2 2 0 002 2h4M16 8l4 4-4 4M20 12H9"/></svg>Log out</button></div>`}};
async function rmImg(i){sync();const u=cur.images[i];cur.images.splice(i,1);keep();
 if(!cur.id)return toast('Image removed');const {error}=await sb.from('cards').update({images:cur.images}).eq('id',cur.id);
 if(error){cur.images.splice(i,0,u);keep();return alert('Could not delete the image. Please try again.')}
 const k=u.split('/card-images/')[1];if(k)sb.storage.from('card-images').remove([k]);toast('Image deleted')}
function keep(){const y=window.scrollY;form();window.scrollTo(0,y)}
function toast(t){const d=document.createElement('div');d.id='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
async function catView(id){const nm=id==='none'?'Uncategorised':(CATS.find(q=>q.id===id)||{}).name||'Category';$('#m').innerHTML='<div class="sk"></div>';
 let q=sb.from('cards').select('id,title,images,published,featured').order('created_at',{ascending:false});q=id==='none'?q.is('category_id',null):q.eq('category_id',id);const {data}=await q,l=data||[];
 $('#m').innerHTML=`<div class="row hd"><div class="grow"><h1>${esc(nm)}</h1><p class="sub">${l.length?l.length+(l.length===1?' card':' cards'):'No cards yet'}</p></div><button class="btn l bk" aria-label="Back to categories" onclick="V.dash()"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>${l.length?l.map(d=>`<div class="box row">${d.images?.[0]?`<img src="${esc(d.images[0])}">`:'<div style="width:56px;height:70px;background:var(--b);border-radius:8px"></div>'}<div class="grow"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.title)}</b><small style="opacity:.6">${d.published?'Published':'Hidden'}${d.featured?' · ★ Featured':''}</small></div><button class="btn l" onclick="editCard('${d.id}')">Edit</button></div>`).join(''):`<div class="empty"><div class="ei"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 9"/></svg></div><b>No cards here yet</b><p>Cards you add to this category will appear here and on your website.</p>${id==='none'?'':`<button class="btn" onclick="addIn('${id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add card</button>`}</div>`}${id==='none'||!l.length?'':`<button class="btn" onclick="addIn('${id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add card here</button>`}`}
async function editCard(id){const {data}=await sb.from('cards').select('*').eq('id',id).single();if(!data)return;cur=data;NF=[];tab='cards';shell()}
function addIn(id){cur={title:'',description:'',customization:'',category_id:id,images:[],featured:false,published:true};NF=[];tab='cards';shell()}
function sync(){cur.title=$('#f_t').value;cur.category_id=$('#f_c').value;cur.description=$('#f_d').value;cur.customization=$('#f_z').value;cur.featured=$('#f_ft').checked;cur.published=$('#f_p').checked}
function addF(i){sync();NF.push(...i.files);i.value='';keep()}
function pv(i){$('#pv').innerHTML=[...i.files].map(f=>`<div class="ti"><img src="${URL.createObjectURL(f)}"></div>`).join('')}
function form(){const d=cur;$('#m').innerHTML=`<h1>${d.id?'Edit card':'New card'}</h1><div class="box fm"><label>Card title</label><input id="f_t" placeholder="e.g. Royal Floral Wedding Invite" maxlength="120" value="${esc(d.title)}"><label>Category</label><select id="f_c"><option value="">Select category</option>${cats.map(c=>`<option value="${c.id}" ${c.id===d.category_id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><label>Description</label><textarea id="f_d" placeholder="Short description shown to customers">${esc(d.description)}</textarea><label>Customization options</label><textarea id="f_z" placeholder="One option per line, e.g. Names, date, venue, colours">${esc(d.customization)}</textarea><label>Images <span>first image is the cover</span></label><div class="th">${d.images.map((u,i)=>`<div class="ti"><img src="${esc(u)}">${i===0?'<em>Cover</em>':''}<button type="button" onclick="rmImg(${i})">✕</button></div>`).join('')}${NF.map((f,i)=>`<div class="ti"><img src="${f._u||(f._u=URL.createObjectURL(f))}"><em>${!d.images.length&&i===0?'Cover':'New'}</em><button type="button" onclick="sync();NF.splice(${i},1);keep();toast('Image removed')">✕</button></div>`).join('')}<label class="ad" for="f_f">+<small>Add images</small></label></div><input type="file" id="f_f" accept="image/*" multiple hidden onchange="addF(this)"><div style="margin-top:8px"><label class="tgl"><input type="checkbox" id="f_ft" ${d.featured?'checked':''}><i></i>Featured on home page</label><label class="tgl"><input type="checkbox" id="f_p" ${d.published?'checked':''}><i></i>Published (visible to customers)</label></div><p class="err" id="fm"></p></div><div class="bar"><button class="btn" id="fb" onclick="sc()">Save card</button><button class="btn l" onclick="cur=null;NF=[];V.cards()">Cancel</button></div>`}
async function sc(){const m=$('#fm');m.textContent='';const t=$('#f_t').value.trim();if(t.length<2)return m.textContent='Enter a card title.';const fl=[...NF];
 if(fl.some(f=>!f.type.startsWith('image/')||f.size>10485760))return m.textContent='Only images under 10 MB allowed.';$('#fb').disabled=true;m.textContent='Saving…';
 try{const urls=[...cur.images];for(const f of fl){const b=await compress(f),X={'image/webp':'webp','image/jpeg':'jpg','image/png':'png'}[b.type];if(!X)throw new Error('Use a JPG, PNG or WebP image');if(b.size>2097152)throw new Error('Image is too large, use one under 2 MB');const p=crypto.randomUUID()+'.'+X,u=await sb.storage.from('card-images').upload(p,b,{contentType:b.type});if(u.error)throw u.error;urls.push(sb.storage.from('card-images').getPublicUrl(p).data.publicUrl)}
  const row={title:t,category_id:$('#f_c').value||null,description:$('#f_d').value,customization:$('#f_z').value,images:urls,featured:$('#f_ft').checked,published:$('#f_p').checked};
  const {error}=cur.id?await sb.from('cards').update(row).eq('id',cur.id):await sb.from('cards').insert(row);if(error)throw error;cur=null;NF=[];V.cards()}catch(e){m.textContent='Save failed: '+(e.message||'try again');$('#fb').disabled=false}}
const ed=id=>{cur={...CL.find(x=>x.id===id)};delete cur.categories;NF=[];V.cards()};
const tg=async(id,k)=>{const c=CL.find(x=>x.id===id);await sb.from('cards').update({[k]:!c[k]}).eq('id',id);V.cards()};
async function dc(id){const c=CL.find(x=>x.id===id);if(!confirm(`Delete "${c.title}"? This cannot be undone.`))return;const p=(c.images||[]).map(u=>u.split('/card-images/')[1]).filter(Boolean);if(p.length)await sb.storage.from('card-images').remove(p);await sb.from('cards').delete().eq('id',id);V.cards()}
const rs=async(id,s)=>{await sb.from(window.rt||'card_reviews').update({status:s}).eq('id',id);V.rev()};
const rd=async id=>{if(confirm('Delete this review?')){await sb.from(window.rt||'card_reviews').delete().eq('id',id);V.rev()}};
async function ss(){const g=k=>$('#s_'+k).value.trim();
 const {error}=await sb.from('settings').update({brand_name:g('brand_name'),tagline:g('tagline')}).eq('id',1);let wu=$('#s_website_url').value.trim();if(wu&&!/^https?:\/\//i.test(wu))wu='https://'+wu;const e2=await sb.from('settings').update({website_url:wu||null}).eq('id',1);if(!e2.error)WEB=wu;let wn=$('#s_whatsapp_number').value.replace(/\D/g,'').slice(-10);$('#s_whatsapp_number').value=wn;if(wn)wn='91'+wn;const e3=await sb.from('settings').update({whatsapp_number:wn||null}).eq('id',1);
 $('#sm').textContent=error?'Could not save.':e2.error?'Brand saved, but the website link needs the SQL step first.':e3.error?'Saved, but the WhatsApp number needs the SQL step first.':'Saved ✓'}
async function ac(){const n=$('#nc').value.trim();if(!n)return toast('Enter a category name');const {error}=await sb.from('categories').insert({name:n,slug:n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),sort_order:cats.length+1});toast(error?'Could not add (name may already exist)':'Category added');V.set()}
async function dcat(id){if(confirm('Delete this category? Its cards become uncategorised.')){await sb.from('categories').delete().eq('id',id);V.set()}}
start();
</script></body></html>
